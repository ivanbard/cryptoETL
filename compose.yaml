services:
  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: local_airflow_only
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles: [airflow]

  airflow-init:
    build: &airflow-build
      context: .
      dockerfile: Dockerfile.airflow
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - mkdir -p /app/data/raw /app/dbt/target /app/dbt/logs && chown 50000:0 /app/data/raw && chown -R 50000:0 /app/dbt/target /app/dbt/logs
    volumes:
      - .:/app
    profiles: [airflow]

  airflow:
    build: *airflow-build
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:local_airflow_only@airflow-db/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: crypto_etl
      PGUSER: crypto
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
      - airflow_home:/opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: [airflow]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: crypto_etl
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_etl"]
      interval: 5s
      timeout: 5s
      retries: 12

  pipeline:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: crypto_etl
      PGUSER: crypto
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

  metabase:
    image: metabase/metabase:v0.63.19.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: "5432"
      MB_DB_USER: crypto
      MB_DB_PASS: ${POSTGRES_PASSWORD:-local_dev_only}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airflow_db_data:
  airflow_home:
  postgres_data:
